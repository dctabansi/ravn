[project]
name = "ravn-api"
version = "0.1.0"
description = "ravn API backend"
requires-python = ">=3.14"
dependencies = [
    "ravn-engine",
]

[project.scripts]
ravn-api = "ravn_api.main:main"

[build-system]
requires = ["uv_build>=0.6.0"]
build-backend = "uv_build"

[tool.uv.sources]
ravn-engine = { workspace = true }
